<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RivOS - Web Operating System</title>
    
    <!-- Estilos Globais e de Componentes -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/components/taskbar.css">
    <link rel="stylesheet" href="css/components/window.css">
    <link rel="stylesheet" href="css/components/notifications.css">
</head>
<body>

    <!-- Área de Trabalho (Desktop) -->
    <div id="riv-desktop" class="desktop-container">
        <!-- Os ícones dos apps instalados serão injetados aqui dinamicamente -->
        <div id="desktop-icons" class="desktop-icons-grid"></div>

        <!-- Container onde as janelas flutuantes dos apps vão abrir -->
        <div id="window-manager" class="window-manager-layer"></div>
    </div>

    <!-- Barra de Tarefas Inferior (Taskbar) -->
    <div id="riv-taskbar" class="taskbar-container">
        <button id="start-menu-btn" class="taskbar-btn">
            <img src="assets/icons/system/logo.svg" alt="RivOS" class="system-logo">
            <span>RivOS</span>
        </button>

        <!-- Lista de apps abertos na barra de tarefas -->
        <div id="taskbar-apps" class="taskbar-apps-list"></div>

        <!-- Relógio e Status do Sistema -->
        <div id="system-tray" class="system-tray">
            <span id="system-clock">00:00</span>
        </div>
    </div>

    <!-- Script Principal do Kernel e Inicialização -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
