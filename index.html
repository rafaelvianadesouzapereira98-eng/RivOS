<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RivOS - Web Operating System</title>
    
    <!-- Camada 1: UI (Estilos e Visual) -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/components/desktop.css">
</head>
<body>

    <!-- Estrutura Principal: Área de Trabalho (Desktop) -->
    <main id="desktop" class="desktop-container">
        <!-- Onde os ícones dos apps da pasta Apps/ aparecerão dinamicamente -->
        <div id="desktop-icons" class="desktop-icons-grid"></div>

        <!-- Camada onde o motor vai injetar as janelas flutuantes dos apps -->
        <div id="window-manager" class="window-layer"></div>
    </main>

    <!-- Gaveta de Apps / Menu Iniciar (Estilo OneUI) -->
<div id="start-menu" class="start-menu-container hidden">
    <!-- Barra de Pesquisa de Apps (Clássico OneUI) -->
    <div class="start-menu-search">
        <input type="text" placeholder="Pesquisar aplicativos..." id="app-search-input">
    </div>
        </div>
    </div>
</div>

</body>
</html>
