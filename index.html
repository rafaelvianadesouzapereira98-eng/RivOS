<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RivOS - Web Operating System</title>
    
    <!-- Camada 1: UI (Estilos e Visual) -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/components/desktop.css">
</head>
<body>

    <!-- Estrutura Principal: Área de Trabalho (Desktop) -->
    <main id="desktop" class="desktop-container">
        <!-- Onde os ícones dos apps da pasta Apps/ aparecerão dinamicamente -->
        <div id="desktop-icons" class="desktop-icons-grid"></div>

        <!-- Camada onde o motor vai injetar as janelas flutuantes dos apps -->
        <div id="window-manager" class="window-layer"></div>
    </main>

    <!-- Estrutura Secundária: Barra de Tarefas (Taskbar) -->
    <nav id="taskbar" class="taskbar-container">
        <!-- Botão de Menu Iniciar -->
        <button id="start-btn" class="taskbar-btn">
            <span class="start-icon">❖</span>
            <span>RivOS</span>
        </button>

        <!-- Container para os botões dos apps abertos -->
        <div id="taskbar-apps" class="taskbar-apps-list"></div>

        <!-- Relógio do sistema -->
        <div id="tray-clock" class="system-clock">00:00</div>
        <script src="js/main.js"></script>
    </nav>
    <!-- Gaveta de Apps / Menu Iniciar -->
<div id="start-menu" class="start-menu-container hidden">
    <div class="start-menu-header">
        <h3>Aplicativos RivOS</h3>
    </div>
    <div class="start-menu-apps">
        <div class="app-item" data-app="settings">⚙️ Configurações</div>
        <div class="app-item" data-app="browser">🌐 Browser</div>
        <div class="app-item" data-app="terminal">💻 Terminal</div>
    </div>
</div>
    
</body>
</html>
