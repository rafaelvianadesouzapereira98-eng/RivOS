<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Fundo Translúcido Liquid Glass -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1.5" style="backdrop-filter: blur(12px);" />
    
    <!-- Brilho Interno Superior -->
    <rect x="3.5" y="3.5" width="57" height="28" rx="14.5" fill="url(#top-shine)" opacity="0.4" />

    <!-- Anel Orbital de IA (Gradiente Tecnológico) -->
    <circle cx="32" cy="32" r="18" stroke="url(#ai-orbit)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="24 8" opacity="0.8" />

    <!-- Seta do Navegador / Cursor Estilizado -->
    <path d="M25 32L39 25L32 39L30 34L25 32Z" fill="url(#arrow-gradient)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Ponto de IA Brilhante (Sparkle) -->
    <circle cx="42" cy="22" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px rgba(255,255,255,0.8))" />
    <path d="M42 18V26M38 22H46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Definições de Gradientes e Efeitos -->
    <defs>
        <linearGradient id="glass-bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2a2a36" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#121218" stop-opacity="0.95" />
        </linearGradient>

        <linearGradient id="glass-border" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
        </linearGradient>

        <linearGradient id="top-shine" x1="32" y1="2" x2="32" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="ai-orbit" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>

        <linearGradient id="arrow-gradient" x1="25" y1="25" x2="39" y2="39" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
    </defs>
</svg>
